<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>故事集</title>
</head>
<body>

    <!-- 使用 HTML 表格進行左右並排 -->
    <table width="100%" border="1" cellpadding="10" cellspacing="0" style="border-collapse: collapse; min-height: 95vh;">
        <tr>
            
            <!-- 【左側：樹狀列與連結】 (寬度固定 250 像素) -->
            <td width="250" valign="top" bgcolor="#f9f9f9">
                <h2>導覽目錄</h2>
                <hr>
                
                <!-- 樹狀第 1 層：主要分類（預設 open 代表打開） -->
                <details open>
                    <summary><b>📂 故事列表</b></summary>
                    <!-- 樹狀第 2 層：子項目選單 -->
                    <ul>
                        <!-- target 屬性填入右邊格子的名字，網頁就會在右邊打開 -->
                        <li><a href="速海北部地區各國.html" target="right_frame">🌐 速海</a></li>
                    </ul>
                </details>

                <br>

                <!-- 樹狀第 1 層：另一個主要分類（預設收合） -->
                <details>
                    <summary><b>📂 常用工具</b></summary>
                    <!-- 樹狀第 2 層：子項目選單 -->
                    <ul>
                        <li></li>
                        <li></li>
                    </ul>
                </details>
                
                <br>
                <small style="color: gray;">💡 提示：點擊 📂 文字可以展開或收合選單</small>
            </td>
            
            <!-- 【右側：顯示被點擊的網頁內容】 -->
            <td valign="top">
                <!-- 1. name="right_frame" 是關鍵，必須與左邊超連結的 target 一致 -->
                <!-- 2. src 是當初次打開網頁時，右邊畫面要顯示的預設網頁 -->
                <iframe name="right_frame" src="速海北部地區各國.html" width="100%" height="650px" frameborder="0">
                    您的瀏覽器不支援內嵌框架。
                </iframe>
            </td>

        </tr>
    </table>

</body>
</html>
